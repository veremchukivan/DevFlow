name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: devflow
          POSTGRES_PASSWORD: devflow
          POSTGRES_DB: devflow_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U devflow -d devflow_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://devflow:devflow@localhost:5432/devflow_test
      TEST_DATABASE_URL: postgresql://devflow:devflow@localhost:5432/devflow_test
      NODE_ENV: test
      JWT_ACCESS_SECRET: test-access-secret-with-at-least-32-characters
      JWT_REFRESH_SECRET: test-refresh-secret-with-at-least-32-characters
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.14.0 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @devflow/shared build
      - run: pnpm --filter @devflow/api typecheck
      - run: pnpm --filter @devflow/web typecheck
      - run: pnpm --filter @devflow/api test
      - run: pnpm --filter @devflow/web build
      - run: pnpm api:openapi:check
