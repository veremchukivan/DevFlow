name: CI

on:
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"
      - "perf/**"
      - "chore/**"
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @devflow/shared build

      - name: Typecheck monorepo
        run: pnpm typecheck

      - name: Lint monorepo
        run: pnpm lint

      - name: Verify OpenAPI document
        run: pnpm api:openapi:check

  test:
    name: Integration Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: devflow
          POSTGRES_USER: devflow
          POSTGRES_PASSWORD: devflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U devflow -d devflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @devflow/shared build

      - name: Configure database roles
        env:
          PGPASSWORD: devflow
        run: |
          psql --host localhost --username devflow --dbname postgres --set ON_ERROR_STOP=1 <<'SQL'
            create role devflow_migrator login nosuperuser nocreatedb nocreaterole noinherit password 'devflow_migrator';
            create role devflow_runtime login nosuperuser nocreatedb nocreaterole noinherit password 'devflow_runtime';
          SQL

      - name: Run API tests
        env:
          DATABASE_ADMIN_URL: postgres://devflow:devflow@localhost:5432/postgres
          DATABASE_URL: postgres://devflow_runtime:devflow_runtime@localhost:5432/devflow
          TEST_DATABASE_URL: postgres://devflow_runtime:devflow_runtime@localhost:5432/devflow_test
          TEST_MIGRATION_DATABASE_URL: postgres://devflow_migrator:devflow_migrator@localhost:5432/devflow_test
        run: pnpm --filter @devflow/api test

  docker-build:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/api.Dockerfile
          push: false
          tags: devflow-api:test

      - name: Build Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/web.Dockerfile
          push: false
          tags: devflow-web:test

  docker-compose-smoke:
    name: Docker Compose Smoke Test
    runs-on: ubuntu-latest
    needs: [docker-build]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create Docker environment
        run: |
          cat > .env <<'EOF'
          POSTGRES_DB=devflow
          POSTGRES_USER=devflow_admin
          POSTGRES_PASSWORD=devflow_admin
          POSTGRES_MIGRATOR_PASSWORD=devflow_migrator
          POSTGRES_RUNTIME_PASSWORD=devflow_runtime
          DOCKER_RUNTIME_DATABASE_URL=postgres://devflow_runtime:devflow_runtime@postgres:5432/devflow
          DOCKER_MIGRATION_DATABASE_URL=postgres://devflow_migrator:devflow_migrator@postgres:5432/devflow
          WEB_ORIGIN=http://localhost:3000
          EOF

      - name: Validate Docker Compose configuration
        run: docker compose --env-file .env -f infra/docker/docker-compose.yml config --quiet

      - name: Start API stack
        run: docker compose --env-file .env -f infra/docker/docker-compose.yml up --detach --build --wait --wait-timeout 120 api

      - name: Verify API health and readiness
        run: |
          curl --fail --retry 10 --retry-all-errors --retry-delay 1 http://localhost:4000/healthz
          curl --fail --retry 10 --retry-all-errors --retry-delay 1 http://localhost:4000/readyz | jq --exit-status '
            .status == "ok" and .checks.database == "ok" and .checks.redis == "ok"
          '

      - name: Show service logs on failure
        if: failure()
        run: docker compose --env-file .env -f infra/docker/docker-compose.yml logs --no-color

      - name: Stop API stack
        if: always()
        run: docker compose --env-file .env -f infra/docker/docker-compose.yml down --volumes --remove-orphans
