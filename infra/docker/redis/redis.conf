# =============================================================================
# DevFlow Redis Configuration
# Optimized for session storage, caching, and rate limiting
# =============================================================================

# Network
bind 0.0.0.0
port 6379
protected-mode no
tcp-keepalive 300
timeout 0

# Memory Management
maxmemory 256mb
maxmemory-policy allkeys-lru

# Persistence (Append Only File)
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec

# Performance & Logging
loglevel notice
slowlog-log-slower-than 10000
slowlog-max-len 128
