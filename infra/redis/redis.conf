# Local development only. Do not use this unauthenticated configuration in production.
bind 0.0.0.0
port 6379
protected-mode no
tcp-keepalive 300
timeout 0

maxmemory 256mb
maxmemory-policy allkeys-lru

appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec

loglevel notice
slowlog-log-slower-than 10000
slowlog-max-len 128
